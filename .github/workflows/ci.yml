name: Frontend CI Pipeline

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      # 1. Hämta koden
      - uses: actions/checkout@v4

      # 2. Node.js med npm-cache
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Installera exakt enligt package-lock.json
      - run: npm ci

      # 4. Statisk kodanalys
      - name: Run Linter
        run: npm run lint

      # 5. Typkontroll + produktionsbygge
      - name: Build
        run: npm run build