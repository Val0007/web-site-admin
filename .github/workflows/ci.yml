name: Admin CI Pipeline

on:
  push:
    branches: main
  pull_request:
    branches: main


permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      # 1. Hämta koden
      - uses: actions/checkout@v4

      # 2. Node.js med npm-cache
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Installera exakt enligt package-lock.json
      - run: npm ci

      # 4. Statisk kodanalys
      - name: Run Linter
        run: npm run lint

      # 5. Typkontroll + produktionsbygge
      - name: Build
        run: npm run build

  deploy:
    # Deploy to Vercel only after lint and build passed, for pushes to main.

    needs: build-and-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Downloads the project's Production settings, including VITE_API_URL_PROD
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
